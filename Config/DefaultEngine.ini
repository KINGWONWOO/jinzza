[OnlineSubsystem]
DefaultPlatformService=Steam
bHasVoiceEnabled=true

; Engine VOIP (mic capture + voice packets) - BaseEngine.ini ships it disabled. Proximity voice playback is
; UjinzzaProximityVoiceComponent; push-to-talk / open mic is AjinzzaPlayerController.
[Voice]
bEnabled=true

; Voice chat quality (2026-10-04). Engine defaults were chopping speech: the noise gate and silence
; detection both sit at 0.08 linear (~-22 dBFS), so quieter syllables and word endings were cut to
; silence; mic gain was 1x; and VOIP ran at 16 kHz (muffled). Lower thresholds + longer release keep
; whole words, 2x gain gives a usable level, 24 kHz is the highest VOIP rate the engine supports.
[ConsoleVariables]
voice.MicNoiseGateThreshold=0.01
voice.SilenceDetectionThreshold=0.01
voice.MicNoiseReleaseTime=0.5
voice.MicInputGain=2.0

[/Script/Engine.AudioSettings]
VoiPSampleRate=Normal24000Hz

; Routes the packaged game's network traffic through Steam's P2P relay (SteamSockets) instead of raw IP
; sockets, so ServerTravel("...?listen")/JoinSession work across NAT without port-forwarding - the whole
; point of using Steam sessions instead of manual IP connect. Falls back to the classic IpNetDriver if
; Steam sockets aren't available. Scoped to GameEngine (not Engine.Engine) so PIE multiplayer testing in
; the editor is unaffected and keeps using the default IP driver.
[/Script/Engine.GameEngine]
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/SteamSockets.SteamSocketsNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")

